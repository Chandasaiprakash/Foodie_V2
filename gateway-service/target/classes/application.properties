# Load Balancer

# Gateway
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.httpclient.connect-timeout=2000
spring.cloud.gateway.httpclient.response-timeout=5000


# Health Checks
management.endpoint.health.show-details=when_authorized
# Expose the Prometheus and health endpoints over HTTP
management.endpoints.web.exposure.include=prometheus,health

# Add an 'application' tag to all metrics for this service
management.metrics.tags.application=${spring.application.name}


# ===================================================================
# ? ADVANCED LOGGING CONFIGURATION (for Development)
# ===================================================================

# --- Base Log Level ---
logging.level.root=INFO

# --- Spring Framework (Webflux for Gateway) ---
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# --- Spring Cloud Gateway ---
# Show detailed routing decisions and filter executions
logging.level.org.springframework.cloud.gateway=DEBUG


# --- Message Queue (Kafka) ---
# The gateway itself doesn't produce/consume, so this can be omitted if you have no custom Kafka logic
logging.level.org.apache.kafka=WARN

# --- Monitoring (ELK & Prometheus) ---
logging.level.net.logstash.logback=WARN
logging.level.org.springframework.boot.actuate=INFO

# --- Your Application Code ---
logging.level.com.foodie=DEBUG

# =========================================
# DISTRIBUTED TRACING (OpenTelemetry)
# =========================================

# Enable tracing via Micrometer
management.tracing.enabled=true

# Sample every request for development. In production, you'd use a lower value like 0.1 (10%)
management.tracing.sampling.probability=1.0

# The endpoint where the Jaeger OTLP collector is listening
management.otlp.tracing.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

# =========================================
# RESILIENCE4J — gateway-service Circuit Breakers
# =========================================

# payment-service CB: open fast if it's slow (money path)
resilience4j.circuitbreaker.instances.payment-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.payment-service.failure-rate-threshold=40
resilience4j.circuitbreaker.instances.payment-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.payment-service.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.payment-service.slow-call-duration-threshold=5s
resilience4j.circuitbreaker.instances.payment-service.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.payment-service.register-health-indicator=true

# delivery-service CB
resilience4j.circuitbreaker.instances.delivery-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.delivery-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.delivery-service.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.delivery-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.delivery-service.slow-call-duration-threshold=4s
resilience4j.circuitbreaker.instances.delivery-service.slow-call-rate-threshold=70
resilience4j.circuitbreaker.instances.delivery-service.register-health-indicator=true

# order-service CB
resilience4j.circuitbreaker.instances.order-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.order-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.order-service.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.order-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.order-service.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.instances.order-service.register-health-indicator=true

# auth-service CB
resilience4j.circuitbreaker.instances.auth-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.auth-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.auth-service.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.auth-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.auth-service.register-health-indicator=true

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=prometheus,health,circuitbreakers

# =========================================
# DEAD-LETTER OPERATOR API — GATEWAY BLOCK
# =========================================
# /internal/** routes must NEVER be exposed to the public internet.
# This route matches any /internal path and rejects it at the gateway
# with 403 before it reaches any downstream service.
# Ops tooling should call the service directly (pod exec / internal load balancer).
spring.cloud.gateway.routes[99].id=block-internal
spring.cloud.gateway.routes[99].uri=no://op
spring.cloud.gateway.routes[99].predicates[0]=Path=/internal/**
spring.cloud.gateway.routes[99].filters[0]=SetStatus=403

# ── Virtual Threads ──────────────────────────────────────────────────────────
# NOTE: spring.threads.virtual.enabled is intentionally NOT set here.
# Spring Cloud Gateway is built on Spring WebFlux (Netty/Reactor) which is
# already fully non-blocking and does not use a Tomcat thread pool.
# Virtual threads are a JVM-level alternative to thread-per-request blocking;
# they provide no benefit over Reactor's event-loop model and are not supported
# on the WebFlux runtime. All other services (Tomcat-based) have VT enabled.
