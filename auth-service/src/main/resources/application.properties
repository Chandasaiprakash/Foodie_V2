server.port=8081
user.service.url=${USER_SERVICE_URL:http://localhost:8085}
user-service.internal-secret=${USER_SERVICE_INTERNAL_SECRET:YOUR_INTERNAL_SHARED_SECRET}
jwt.secret=${JWT_SECRET:super-secret-key-change-me-super-secret-key}

spring.datasource.url=jdbc:mysql://localhost:3306/foodie_auth?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.application.name=auth-service


# Expose the Prometheus and health endpoints over HTTP
management.endpoints.web.exposure.include=prometheus,health

# Add an 'application' tag to all metrics for this service
management.metrics.tags.application=${spring.application.name}


# ===================================================================
# ? ADVANCED LOGGING CONFIGURATION (for Development)
# ===================================================================

# --- Base Log Level ---
logging.level.root=INFO

# --- Spring Framework ---
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# --- Database & Data (JPA/Hibernate) ---
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Show full request/response for Feign client calls
logging.level.org.springframework.cloud.openfeign=DEBUG

# --- Monitoring (ELK & Prometheus) ---
logging.level.net.logstash.logback=WARN
logging.level.org.springframework.boot.actuate=INFO

# --- Your Application Code ---
logging.level.com.foodie=DEBUG

# =========================================
# DISTRIBUTED TRACING (OpenTelemetry)
# =========================================

# Enable tracing via Micrometer
management.tracing.enabled=true

# Sample every request for development. In production, you'd use a lower value like 0.1 (10%)
management.tracing.sampling.probability=1.0

# The endpoint where the Jaeger OTLP collector is listening
management.otlp.tracing.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

# =========================================
# RESILIENCE4J — auth-service
# =========================================

# Circuit Breaker: wraps Feign calls to user-service
resilience4j.circuitbreaker.instances.userServiceClient.register-health-indicator=true
resilience4j.circuitbreaker.instances.userServiceClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.userServiceClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userServiceClient.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.userServiceClient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.userServiceClient.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.instances.userServiceClient.slow-call-rate-threshold=60

# Retry: login calls should not retry (not idempotent risk); registration can
resilience4j.retry.instances.userServiceClient.max-attempts=2
resilience4j.retry.instances.userServiceClient.wait-duration=300ms
resilience4j.retry.instances.userServiceClient.retry-exceptions=java.net.ConnectException,feign.RetryableException

# Bulkhead: prevent thread exhaustion if user-service is slow
resilience4j.bulkhead.instances.userServiceClient.max-concurrent-calls=30
resilience4j.bulkhead.instances.userServiceClient.max-wait-duration=0ms

# RateLimiter: protect auth endpoints from brute-force / burst
resilience4j.ratelimiter.instances.authEndpoint.limit-for-period=20
resilience4j.ratelimiter.instances.authEndpoint.limit-refresh-period=1s
resilience4j.ratelimiter.instances.authEndpoint.timeout-duration=0s

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=prometheus,health,circuitbreakers

# ── Virtual Threads (Java 21+ / Spring Boot 3.2+) ──────────────────────────
# Replaces the Tomcat thread pool with virtual threads from the JDK loom runtime.
# Each request runs on its own lightweight virtual thread — no blocking, no pool
# exhaustion, no tuning of max-threads required.
spring.threads.virtual.enabled=true
