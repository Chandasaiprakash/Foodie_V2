server.port=8088

spring.application.name=cart-service

spring.data.mongodb.uri=mongodb://localhost:27017/foodie_cart

# Expose the Prometheus and health endpoints over HTTP
management.endpoints.web.exposure.include=prometheus,health
management.metrics.tags.application=${spring.application.name}

# =========================================
# DISTRIBUTED TRACING (OpenTelemetry)
# =========================================
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

# ===================================================================
# LOGGING
# ===================================================================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.foodie=DEBUG

# ── Virtual Threads (Java 21+ / Spring Boot 3.2+) ──────────────────────────
spring.threads.virtual.enabled=true
