name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Fast backend validation
        run: mvn -B -ntp clean verify -DskipITs

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Foodie-App-Frontend/package-lock.json

      - name: Build frontend
        working-directory: Foodie-App-Frontend
        run: |
          npm ci
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.service
          push: false
          build-args: |
            SERVICE_DIR=order-service
          tags: foodie-order-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  infra-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Helm chart
        run: |
          helm lint infra/helm/foddie -f infra/helm/foddie/Values.yaml
          helm template foodie infra/helm/foddie \
            --namespace foodie \
            -f infra/helm/foddie/Values.yaml \
            --set global.imageTag="${GITHUB_SHA}" \
            > helm-rendered.yaml

      - name: Validate Kustomize base
        run: kubectl kustomize infra/k8s > kustomize-rendered.yaml