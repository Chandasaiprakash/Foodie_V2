name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend
        run: mvn -B -ntp verify

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Foodie-App-Frontend/package-lock.json

      - name: Build frontend
        working-directory: Foodie-App-Frontend
        run: |
          npm ci
          npm run build

      - name: Build Docker images
        shell: bash
        run: |
          services=(
            gateway-service
            auth-service
            user-service
            restaurant-service
            order-service
            payment-service
            delivery-service
            notification-service
            cart-service
          )

          for service in "${services[@]}"; do
            docker build \
              -f Dockerfile.service \
              --build-arg SERVICE_DIR="$service" \
              -t "foodie-$service:${GITHUB_SHA}" \
              .
          done

          docker build \
            -t "foodie-frontend:${GITHUB_SHA}" \
            Foodie-App-Frontend

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Helm chart
        run: |
          helm lint infra/helm/foddie -f infra/helm/foddie/Values.yaml
          helm template foodie infra/helm/foddie \
            --namespace foodie \
            -f infra/helm/foddie/Values.yaml \
            --set global.imageTag="${GITHUB_SHA}" \
            > helm-rendered.yaml

      - name: Validate Kustomize base
        run: kubectl kustomize infra/k8s > kustomize-rendered.yaml
