name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Fast backend validation
        run: mvn -B -ntp clean verify -DskipITs

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            */target/*.jar
          retention-days: 1

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frontend exists
        run: |
          if [ ! -f "Foodie-App-Frontend/package.json" ]; then
            echo "Frontend package.json missing"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate lockfile if missing
        working-directory: Foodie-App-Frontend
        run: |
          if [ ! -f package-lock.json ]; then
            npm install
          fi

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('Foodie-App-Frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build frontend
        working-directory: Foodie-App-Frontend
        run: |
          npm ci
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-jars

      - name: Restore JAR structure
        run: |
          mkdir -p order-service/target
          find . -name "order-service-*.jar" -exec cp {} order-service/target/order-service-0.0.1-SNAPSHOT.jar \;

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.service
          push: false
          build-args: |
            SERVICE_DIR=order-service
          tags: foodie-order-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  infra-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Helm chart
        run: |
          helm lint infra/helm/foddie -f infra/helm/foddie/Values.yaml
          helm template foodie infra/helm/foddie \
            --namespace foodie \
            -f infra/helm/foddie/Values.yaml \
            --set global.imageTag="${GITHUB_SHA}" \
            > helm-rendered.yaml

      - name: Validate Kustomize base
        run: kubectl kustomize infra/k8s > kustomize-rendered.yaml