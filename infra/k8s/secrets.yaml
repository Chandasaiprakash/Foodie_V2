# =============================================================================
# FOODIE — Kubernetes Secrets (TEMPLATE — values are placeholders)
#
# ⚠  NEVER commit real credentials here.
# In production, generate this file with a tool such as:
#   - Sealed Secrets (Bitnami)   — encrypts values so the file is safe to commit
#   - External Secrets Operator  — syncs from AWS Secrets Manager / Vault
#   - SOPS + Helm secrets plugin — encrypts with KMS before commit
#
# For local/CI use, create secrets imperatively:
#   kubectl create secret generic foodie-db-credentials \
#     --from-literal=SPRING_DATASOURCE_USERNAME=foodie \
#     --from-literal=SPRING_DATASOURCE_PASSWORD=<pwd> -n foodie
#
# This file documents the expected keys — base64 values are placeholders.
# =============================================================================

---
# ── Database credentials (MySQL) ─────────────────────────────────────────────
# Shared by order-service, payment-service, auth-service, user-service
apiVersion: v1
kind: Secret
metadata:
  name: foodie-db-credentials
  namespace: foodie
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "foodie_app"      # replace at deploy time
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME"       # replace at deploy time

---
# ── MongoDB credentials ───────────────────────────────────────────────────────
# Shared by delivery-service, restaurant-service, cart-service
apiVersion: v1
kind: Secret
metadata:
  name: foodie-mongo-credentials
  namespace: foodie
type: Opaque
stringData:
  SPRING_DATA_MONGODB_USERNAME: "foodie_app"    # replace at deploy time
  SPRING_DATA_MONGODB_PASSWORD: "CHANGE_ME"     # replace at deploy time

---
# ── Razorpay credentials (payment-service only) ───────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: razorpay-credentials
  namespace: foodie
type: Opaque
stringData:
  RAZORPAY_KEY_ID: "rzp_test_CHANGE_ME"
  RAZORPAY_KEY_SECRET: "CHANGE_ME"
  RAZORPAY_WEBHOOK_SECRET: "CHANGE_ME"

---
# ── JWT signing secret (auth-service + gateway-service) ──────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: foodie-jwt-secret
  namespace: foodie
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_min_256bit_random_string"

---
# ── Internal service shared secret (auth↔user) ───────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: foodie-internal-secret
  namespace: foodie
type: Opaque
stringData:
  USER_SERVICE_INTERNAL_SECRET: "CHANGE_ME"
