---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: foodie
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: foodie-services
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - gateway-service.foodie.svc.cluster.local
              - auth-service.foodie.svc.cluster.local
              - user-service.foodie.svc.cluster.local
              - restaurant-service.foodie.svc.cluster.local
              - order-service.foodie.svc.cluster.local
              - payment-service.foodie.svc.cluster.local
              - delivery-service.foodie.svc.cluster.local
              - notification-service.foodie.svc.cluster.local
              - cart-service.foodie.svc.cluster.local

      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector.foodie.svc.cluster.local:8888"]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: foodie
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-remote-write-receiver
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: foodie
  labels:
    app: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
