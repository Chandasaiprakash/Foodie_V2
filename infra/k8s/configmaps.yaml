---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-service-config
  namespace: foodie
data:
  SERVER_PORT: "8080"
  SPRING_APPLICATION_NAME: "gateway-service"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "prometheus,health,circuitbreakers"
  MANAGEMENT_OTLP_TRACING_ENDPOINT: "http://otel-collector.foodie.svc.cluster.local:4318/v1/traces"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  LOGGING_LEVEL_COM_FOODIE: "INFO"

