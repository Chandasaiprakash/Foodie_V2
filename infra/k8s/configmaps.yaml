# =============================================================================
# FOODIE — Kubernetes ConfigMaps
#
# Replaces Spring Cloud Config Server. Each service's non-secret configuration
# is mounted as environment variables from its own ConfigMap. Sensitive values
# (DB passwords, Razorpay keys, JWT secret) live in Secrets — see secrets.yaml.
#
# Apply:   kubectl apply -f infra/k8s/configmaps.yaml -n foodie
# Update:  kubectl apply -f infra/k8s/configmaps.yaml -n foodie  (rolling pods pick it up)
# =============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: foodie
data:
  SERVER_PORT: "8082"
  SPRING_APPLICATION_NAME: "order-service"
  # Kafka
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka.foodie.svc.cluster.local:9092"
  # Observability
  MANAGEMENT_OTLP_TRACING_ENDPOINT: "http://otel-collector.foodie.svc.cluster.local:4318/v1/traces"
  # 1.0 = record every trace (appropriate for staging; tune down for high-volume prod).
  # Override per-environment via --set in Helm or a separate prod ConfigMap.
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  # Outbox
  OUTBOX_POLLER_FIXED_DELAY_MS: "5000"
  OUTBOX_CLEANUP_CRON: "0 0 2 * * *"
  # Logging
  LOGGING_LEVEL_COM_FOODIE: "INFO"

