global:
  registry: ""
  imageTag: "local"
  imagePullPolicy: IfNotPresent
  namespace: foodie

kafka:
  bootstrapServers: "kafka.foodie.svc.cluster.local:9092"

services:
  frontend:
    replicaCount: 1
    port: 80
    configMapRef: ""
    secretRefs: []
    probePath: /
    service:
      type: ClusterIP
      port: 80
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "200m"
    hpa:
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

  gateway-service:
    replicaCount: 2
    port: 8080
    configMapRef: gateway-service-config
    secretRefs:
      - foodie-jwt-secret
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    hpa:
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

  auth-service:
    replicaCount: 2
    port: 8081
    configMapRef: auth-service-config
    secretRefs:
      - foodie-db-credentials
      - foodie-jwt-secret
      - foodie-internal-secret
    datasourceUrl: "jdbc:mysql://mysql.foodie.svc.cluster.local:3306/foodie_auth?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    hpa:
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 60
      targetMemoryUtilizationPercentage: 80

  user-service:
    replicaCount: 2
    port: 8085
    configMapRef: user-service-config
    secretRefs:
      - foodie-db-credentials
      - foodie-internal-secret
    datasourceUrl: "jdbc:mysql://mysql.foodie.svc.cluster.local:3306/foodie_user?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "512Mi"
        cpu: "400m"
    hpa:
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

  restaurant-service:
    replicaCount: 2
    port: 8084
    configMapRef: restaurant-service-config
    secretRefs: []
    mongoUri: "mongodb://mongo.foodie.svc.cluster.local:27017/foodie_restaurant"
    resources:
      requests:
        memory: "384Mi"
        cpu: "250m"
      limits:
        memory: "768Mi"
        cpu: "600m"
    hpa:
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 65
      targetMemoryUtilizationPercentage: 80

  cart-service:
    replicaCount: 1
    port: 8088
    configMapRef: cart-service-config
    secretRefs: []
    mongoUri: "mongodb://mongo.foodie.svc.cluster.local:27017/foodie_cart"
    resources:
      requests:
        memory: "192Mi"
        cpu: "150m"
      limits:
        memory: "384Mi"
        cpu: "300m"
    hpa:
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

  order-service:
    replicaCount: 2
    port: 8082
    configMapRef: order-service-config
    secretRefs:
      - foodie-db-credentials
    datasourceUrl: "jdbc:mysql://mysql.foodie.svc.cluster.local:3306/foodie_order?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    keda:
      minReplicaCount: 1
      maxReplicaCount: 10
      cooldownPeriod: 300
      pollingInterval: 15
      triggers:
        - topic: payment-completed
          consumerGroup: order-service-group
          lagThreshold: "100"
          offsetResetPolicy: latest
        - topic: payment-failed
          consumerGroup: order-service-group
          lagThreshold: "100"
          offsetResetPolicy: latest
        - topic: delivery-events
          consumerGroup: order-service-group
          lagThreshold: "100"
          offsetResetPolicy: latest

  payment-service:
    replicaCount: 2
    port: 8083
    configMapRef: payment-service-config
    secretRefs:
      - foodie-db-credentials
      - razorpay-credentials
    datasourceUrl: "jdbc:mysql://mysql.foodie.svc.cluster.local:3306/foodie_payment?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    keda:
      minReplicaCount: 2
      maxReplicaCount: 12
      cooldownPeriod: 300
      pollingInterval: 10
      triggers:
        - topic: order-created
          consumerGroup: payment-service-group
          lagThreshold: "50"
          offsetResetPolicy: latest

  delivery-service:
    replicaCount: 2
    port: 8086
    configMapRef: delivery-service-config
    secretRefs: []
    mongoUri: "mongodb://mongo.foodie.svc.cluster.local:27017/foodie_delivery"
    resources:
      requests:
        memory: "384Mi"
        cpu: "200m"
      limits:
        memory: "768Mi"
        cpu: "400m"
    keda:
      minReplicaCount: 1
      maxReplicaCount: 8
      cooldownPeriod: 300
      pollingInterval: 15
      triggers:
        - topic: payment-completed
          consumerGroup: delivery-service-group
          lagThreshold: "100"
          offsetResetPolicy: latest

  notification-service:
    replicaCount: 1
    port: 8087
    configMapRef: notification-service-config
    secretRefs: []
    resources:
      requests:
        memory: "192Mi"
        cpu: "100m"
      limits:
        memory: "384Mi"
        cpu: "300m"
    keda:
      minReplicaCount: 1
      maxReplicaCount: 6
      cooldownPeriod: 300
      pollingInterval: 15
      triggers:
        - topic: order-updated
          consumerGroup: notification-service-group
          lagThreshold: "200"
          offsetResetPolicy: latest
        - topic: delivery-events
          consumerGroup: notification-service-group
          lagThreshold: "200"
          offsetResetPolicy: latest

startupProbe:
  httpGet:
    path: /actuator/health/readiness
  failureThreshold: 30
  periodSeconds: 5

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
  initialDelaySeconds: 0
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 3
  successThreshold: 1
  timeoutSeconds: 5

rollingUpdate:
  maxUnavailable: 0
  maxSurge: 1
