{{- range $name, $config := .Values.services }}
{{- $registry := trimSuffix "/" $.Values.global.registry }}
{{- $imageName := default (printf "foodie-%s" $name) $config.imageName }}
{{- $probePath := default $.Values.readinessProbe.httpGet.path $config.probePath }}
{{- $livenessPath := default $.Values.livenessProbe.httpGet.path $config.probePath }}
{{- $service := default (dict) $config.service }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $name }}
    version: {{ $.Values.global.imageTag | quote }}
spec:
  replicas: {{ $config.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ $.Values.rollingUpdate.maxUnavailable }}
      maxSurge: {{ $.Values.rollingUpdate.maxSurge }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        version: {{ $.Values.global.imageTag | quote }}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: {{ $name }}
          image: "{{ if $registry }}{{ $registry }}/{{ $imageName }}:{{ $.Values.global.imageTag }}{{ else }}{{ $imageName }}:{{ $.Values.global.imageTag }}{{ end }}"
          imagePullPolicy: {{ default $.Values.global.imagePullPolicy $config.imagePullPolicy }}
          ports:
            - containerPort: {{ $config.port }}
              name: http
          {{- if or $config.configMapRef $config.secretRefs }}
          envFrom:
            {{- if $config.configMapRef }}
            - configMapRef:
                name: {{ $config.configMapRef }}
            {{- end }}
            {{- range $config.secretRefs }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          {{- if or $config.datasourceUrl $config.mongoUri $config.extraEnv }}
          env:
            {{- if $config.datasourceUrl }}
            - name: SPRING_DATASOURCE_URL
              value: {{ $config.datasourceUrl | quote }}
            {{- end }}
            {{- if $config.mongoUri }}
            - name: SPRING_DATA_MONGODB_URI
              value: {{ $config.mongoUri | quote }}
            {{- end }}
            {{- range $key, $value := $config.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          resources:
            requests:
              memory: {{ $config.resources.requests.memory | quote }}
              cpu: {{ $config.resources.requests.cpu | quote }}
            limits:
              memory: {{ $config.resources.limits.memory | quote }}
              cpu: {{ $config.resources.limits.cpu | quote }}
          startupProbe:
            httpGet:
              path: {{ $probePath }}
              port: http
            failureThreshold: {{ $.Values.startupProbe.failureThreshold }}
            periodSeconds: {{ $.Values.startupProbe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ $livenessPath }}
              port: http
            initialDelaySeconds: {{ $.Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ $.Values.livenessProbe.failureThreshold }}
            timeoutSeconds: {{ $.Values.livenessProbe.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ $probePath }}
              port: http
            initialDelaySeconds: {{ $.Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ $.Values.readinessProbe.failureThreshold }}
            successThreshold: {{ $.Values.readinessProbe.successThreshold }}
            timeoutSeconds: {{ $.Values.readinessProbe.timeoutSeconds }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $name }}
spec:
  type: {{ default "ClusterIP" $service.type }}
  selector:
    app: {{ $name }}
  ports:
    - protocol: TCP
      port: {{ default 80 $service.port }}
      targetPort: http
{{- end }}
