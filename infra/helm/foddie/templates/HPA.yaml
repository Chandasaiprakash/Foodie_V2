# =============================================================================
# Standard Kubernetes HorizontalPodAutoscaler (HPA)
#
# Applied to HTTP-facing services that have no Kafka consumer lag to track.
# Scales on CPU utilisation so burst API traffic (flash sales, peak lunch hours)
# causes pods to spin up before requests start queuing.
#
# Services covered:
#   gateway-service     — sole public ingress point; CPU/RPS spikes here first
#   auth-service        — JWT sign/verify is CPU-bound
#   restaurant-service  — search queries hit Elasticsearch; CPU + memory spike
#   user-service        — lightweight CRUD; moderate scaling needed
#   cart-service        — Redis-backed; scales with session volume
#
# Kafka consumers (order, payment, delivery, notification) are scaled by KEDA
# ScaledObjects in keda-scaledobjects.yaml — HPA is intentionally omitted there
# to avoid dual-controller conflicts (two controllers fighting over replicas).
# =============================================================================

{{- range $name, $config := .Values.services }}
{{- if $config.hpa }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}-hpa
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $config.hpa.minReplicas }}
  maxReplicas: {{ $config.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Scale up when average CPU across all pods exceeds this %.
          # 70 % leaves headroom before requests start queueing (typical JVM
          # GC pauses lift utilisation by 10-15 % momentarily).
          averageUtilization: {{ $config.hpa.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          # Memory is a secondary signal. JVM heap is sized by -Xmx, so memory
          # rarely triggers scaling on its own — this guard catches leaks or
          # unusually large request bodies before the pod OOMs.
          averageUtilization: {{ $config.hpa.targetMemoryUtilizationPercentage }}
  behavior:
    scaleUp:
      # React quickly to traffic spikes: allow doubling replicas every 30 s.
      # stabilizationWindowSeconds: 0 means act immediately on the first breach.
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      # Scale down conservatively: wait 5 minutes after the metric drops before
      # removing pods. This avoids thrashing when traffic oscillates around the
      # threshold (e.g. a user hitting refresh repeatedly).
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
{{- end }}
{{- end }}
