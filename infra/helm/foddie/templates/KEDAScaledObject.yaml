{{- range $name, $config := .Values.services }}
{{- if $config.keda }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}-scaledobject
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicaCount: {{ $config.keda.minReplicaCount }}
  maxReplicaCount: {{ $config.keda.maxReplicaCount }}
  cooldownPeriod: {{ default 300 $config.keda.cooldownPeriod }}
  pollingInterval: {{ default 15 $config.keda.pollingInterval }}
  triggers:
    {{- range $config.keda.triggers }}
    - type: kafka
      metadata:
        bootstrapServers: {{ $.Values.kafka.bootstrapServers | quote }}
        consumerGroup: {{ .consumerGroup | quote }}
        topic: {{ .topic | quote }}
        lagThreshold: {{ .lagThreshold | quote }}
        offsetResetPolicy: {{ default "latest" .offsetResetPolicy | quote }}
    {{- end }}
{{- end }}
{{- end }}
