server.port=8083

spring.application.name=payment-service

spring.datasource.url=jdbc:mysql://localhost:3306/foodie_payment?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.auto-offset-reset=earliest


# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer Configuration
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.foodie.common.events

# Expose the Prometheus and health endpoints over HTTP
management.endpoints.web.exposure.include=prometheus,health

# Add an 'application' tag to all metrics for this service
management.metrics.tags.application=${spring.application.name}


# Razorpay Configuration
# ⚠ Never commit real credentials here.
# Set these as environment variables or Kubernetes Secrets at deploy time.
# Local dev: export RAZORPAY_KEY_ID=rzp_test_xxx  RAZORPAY_KEY_SECRET=xxx  RAZORPAY_WEBHOOK_SECRET=xxx
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}


# ===================================================================
# ? ADVANCED LOGGING CONFIGURATION (for Development)
# ===================================================================

# --- Base Log Level ---
logging.level.root=INFO

# --- Spring Framework ---
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# --- Database & Data (JPA/Hibernate) ---
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# --- Message Queue (Kafka) ---
logging.level.org.apache.kafka=WARN

# --- Monitoring (ELK & Prometheus) ---
logging.level.net.logstash.logback=WARN
logging.level.org.springframework.boot.actuate=INFO

# --- Your Application Code ---
logging.level.com.foodie=DEBUG

# =========================================
# DISTRIBUTED TRACING (OpenTelemetry)
# =========================================

# Enable tracing via Micrometer
management.tracing.enabled=true

# Sample every request for development. In production, you'd use a lower value like 0.1 (10%)
management.tracing.sampling.probability=1.0

# The endpoint where the Jaeger OTLP collector is listening
management.otlp.tracing.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# =========================================
# RESILIENCE4J — payment-service
# =========================================

# Circuit Breaker: wraps Razorpay HTTP calls (external 3rd party)
resilience4j.circuitbreaker.instances.razorpay.register-health-indicator=true
resilience4j.circuitbreaker.instances.razorpay.sliding-window-size=10
resilience4j.circuitbreaker.instances.razorpay.failure-rate-threshold=40
resilience4j.circuitbreaker.instances.razorpay.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.razorpay.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.razorpay.slow-call-duration-threshold=5s
resilience4j.circuitbreaker.instances.razorpay.slow-call-rate-threshold=60

# Retry: Razorpay order creation can be retried (idempotent — uses same receipt)
resilience4j.retry.instances.razorpay.max-attempts=3
resilience4j.retry.instances.razorpay.wait-duration=1s
resilience4j.retry.instances.razorpay.enable-exponential-backoff=true
resilience4j.retry.instances.razorpay.exponential-backoff-multiplier=2
resilience4j.retry.instances.razorpay.retry-exceptions=java.io.IOException,java.net.ConnectException

# Bulkhead: at most 10 concurrent Razorpay calls (API rate limit awareness)
resilience4j.bulkhead.instances.razorpay.max-concurrent-calls=10
resilience4j.bulkhead.instances.razorpay.max-wait-duration=0ms

# RateLimiter: /payments/create — max 50 requests/sec to avoid Razorpay throttle
resilience4j.ratelimiter.instances.paymentCreate.limit-for-period=50
resilience4j.ratelimiter.instances.paymentCreate.limit-refresh-period=1s
resilience4j.ratelimiter.instances.paymentCreate.timeout-duration=0s

# RateLimiter: /payments/verify — can be hit by retries; cap at 100/sec
resilience4j.ratelimiter.instances.paymentVerify.limit-for-period=100
resilience4j.ratelimiter.instances.paymentVerify.limit-refresh-period=1s
resilience4j.ratelimiter.instances.paymentVerify.timeout-duration=0s

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=prometheus,health,circuitbreakers

# =========================================
# OUTBOX PATTERN
# =========================================
outbox.poller.fixed-delay-ms=5000
outbox.cleanup.cron=0 0 2 * * *

# ── Correlation ID: stamp X-Correlation-ID onto every outgoing Kafka message ──
spring.kafka.producer.properties.interceptor.classes=com.foodie.payment_service.kafka.KafkaCorrelationProducerInterceptor

# ── Virtual Threads (Java 21+ / Spring Boot 3.2+) ──────────────────────────
# Replaces the Tomcat thread pool with virtual threads from the JDK loom runtime.
# Each request runs on its own lightweight virtual thread — no blocking, no pool
# exhaustion, no tuning of max-threads required.
spring.threads.virtual.enabled=true
