# ============================================================
# Payment-service test profile
# ============================================================

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.cloud.discovery.enabled=false
management.tracing.enabled=false

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.foodie.common.events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Razorpay stub — actual values injected by DynamicPropertySource
razorpay.key-id=rzp_test_stub
razorpay.key-secret=stub_secret
razorpay.webhook-secret=stub_webhook

logging.level.root=WARN
logging.level.com.foodie=INFO
logging.level.org.springframework.kafka=WARN
logging.level.org.testcontainers=INFO

# Explicitly disable OTLP tracing autoconfiguration in tests
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.tracing.enabled=false
management.tracing.sampling.probability=0.0

# Exclude OTLP autoconfiguration to prevent connection attempts in tests
spring.autoconfigure.exclude=\
  io.opentelemetry.instrumentation.spring.autoconfigure.OpenTelemetryAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration
