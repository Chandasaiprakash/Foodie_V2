server.port=8086

spring.application.name=delivery-service

spring.data.mongodb.uri=mongodb://localhost:27017/foodie_delivery

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=delivery-service-group
spring.kafka.consumer.auto-offset-reset=earliest

# Feign: call order-service on localhost (adjust if gateway used)
order.service.url=${ORDER_SERVICE_URL:http://localhost:8082}

# Expose the Prometheus and health endpoints over HTTP
management.endpoints.web.exposure.include=prometheus,health

# Add an 'application' tag to all metrics for this service
management.metrics.tags.application=${spring.application.name}

# This tells Spring Kafka to add a '__TypeId__' header to each message
spring.kafka.producer.properties.spring.json.add.type.headers=true


# ===================================================================
# ? ADVANCED LOGGING CONFIGURATION (for Development)
# ===================================================================

# --- Base Log Level ---
logging.level.root=INFO

# --- Spring Framework ---
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# --- Database (MongoDB) ---
# Show the queries being sent to MongoDB
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Show full request/response for Feign client calls
logging.level.org.springframework.cloud.openfeign=DEBUG

# --- Message Queue (Kafka) ---
logging.level.org.apache.kafka=WARN

# --- Monitoring (ELK & Prometheus) ---
logging.level.net.logstash.logback=WARN
logging.level.org.springframework.boot.actuate=INFO

# --- Your Application Code ---
logging.level.com.foodie=DEBUG

# =========================================
# DISTRIBUTED TRACING (OpenTelemetry)
# =========================================

# Enable tracing via Micrometer
management.tracing.enabled=true

# Sample every request for development. In production, you'd use a lower value like 0.1 (10%)
management.tracing.sampling.probability=1.0

# The endpoint where the Jaeger OTLP collector is listening
management.otlp.tracing.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# =========================================
# RESILIENCE4J — delivery-service
# =========================================

# Circuit Breaker: wraps calls to order-service via Feign
resilience4j.circuitbreaker.instances.orderServiceClient.register-health-indicator=true
resilience4j.circuitbreaker.instances.orderServiceClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.orderServiceClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orderServiceClient.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.orderServiceClient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.orderServiceClient.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.orderServiceClient.slow-call-rate-threshold=80

# Retry: 2 attempts, 500ms wait, only on connection errors
resilience4j.retry.instances.orderServiceClient.max-attempts=2
resilience4j.retry.instances.orderServiceClient.wait-duration=500ms
resilience4j.retry.instances.orderServiceClient.retry-exceptions=java.net.ConnectException,feign.RetryableException

# Bulkhead: limits concurrent in-flight calls to order-service
resilience4j.bulkhead.instances.orderServiceClient.max-concurrent-calls=20
resilience4j.bulkhead.instances.orderServiceClient.max-wait-duration=100ms

# Expose circuit breaker health in actuator
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=prometheus,health,circuitbreakers

# =========================================
# OUTBOX PATTERN
# =========================================
outbox.poller.fixed-delay-ms=5000

# ── Correlation ID: stamp X-Correlation-ID onto every outgoing Kafka message ──
spring.kafka.producer.properties.interceptor.classes=com.foodie.delivery_service.kafka.KafkaCorrelationProducerInterceptor

# ── Virtual Threads (Java 21+ / Spring Boot 3.2+) ──────────────────────────
# Replaces the Tomcat thread pool with virtual threads from the JDK loom runtime.
# Each request runs on its own lightweight virtual thread — no blocking, no pool
# exhaustion, no tuning of max-threads required.
spring.threads.virtual.enabled=true
