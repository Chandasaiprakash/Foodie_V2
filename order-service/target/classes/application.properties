server.port=8082

spring.application.name=order-service

spring.datasource.url=jdbc:mysql://localhost:3306/foodie_order?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.kafka.bootstrap-servers=localhost:9092



# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Consumer Configuration
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.foodie.common.events

# Expose the Prometheus and health endpoints over HTTP
management.endpoints.web.exposure.include=prometheus,health

# Add an 'application' tag to all metrics for this service
management.metrics.tags.application=${spring.application.name}

# This tells Spring Kafka to add a '__TypeId__' header to each message
spring.kafka.producer.properties.spring.json.add.type.headers=true


# ===================================================================
# ? ADVANCED LOGGING CONFIGURATION (for Development)
# ===================================================================

# --- Base Log Level ---
logging.level.root=INFO

# --- Spring Framework ---
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# --- Database & Data (JPA/Hibernate) ---
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# --- Message Queue (Kafka) ---
logging.level.org.apache.kafka=WARN

# --- Monitoring (ELK & Prometheus) ---
logging.level.net.logstash.logback=WARN
logging.level.org.springframework.boot.actuate=INFO

# --- Your Application Code ---
logging.level.com.foodie=DEBUG

# =========================================
# DISTRIBUTED TRACING (OpenTelemetry)
# =========================================

# Enable tracing via Micrometer
management.tracing.enabled=true

# Sample every request for development. In production, you'd use a lower value like 0.1 (10%)
management.tracing.sampling.probability=1.0

# The endpoint where the Jaeger OTLP collector is listening
management.otlp.tracing.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# =========================================
# RESILIENCE4J — order-service
# =========================================

# Circuit Breaker: wraps Kafka publish in createOrder
resilience4j.circuitbreaker.instances.kafkaPublish.register-health-indicator=true
resilience4j.circuitbreaker.instances.kafkaPublish.sliding-window-size=10
resilience4j.circuitbreaker.instances.kafkaPublish.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kafkaPublish.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.kafkaPublish.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.kafkaPublish.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.instances.kafkaPublish.slow-call-rate-threshold=80

# Retry: retry Kafka publish up to 3 times with backoff
resilience4j.retry.instances.kafkaPublish.max-attempts=3
resilience4j.retry.instances.kafkaPublish.wait-duration=500ms
resilience4j.retry.instances.kafkaPublish.enable-exponential-backoff=true
resilience4j.retry.instances.kafkaPublish.exponential-backoff-multiplier=2

# Bulkhead: limit concurrent order creation calls
resilience4j.bulkhead.instances.orderCreation.max-concurrent-calls=50
resilience4j.bulkhead.instances.orderCreation.max-wait-duration=500ms

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=prometheus,health,circuitbreakers

# =========================================
# OUTBOX PATTERN
# =========================================
# Poller interval: publish PENDING outbox events every 5 seconds
outbox.poller.fixed-delay-ms=5000
# Cleanup cron: delete PUBLISHED rows older than 7 days, runs daily at 02:00
outbox.cleanup.cron=0 0 2 * * *

# ── Correlation ID: stamp X-Correlation-ID onto every outgoing Kafka message ──
spring.kafka.producer.properties.interceptor.classes=com.foodie.order_service.kafka.KafkaCorrelationProducerInterceptor

# ── Virtual Threads (Java 21+ / Spring Boot 3.2+) ──────────────────────────
# Replaces the Tomcat thread pool with virtual threads from the JDK loom runtime.
# Each request runs on its own lightweight virtual thread — no blocking, no pool
# exhaustion, no tuning of max-threads required.
spring.threads.virtual.enabled=true
