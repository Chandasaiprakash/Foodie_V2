# ============================================================
# Order-service test profile
# Testcontainers overrides spring.kafka.bootstrap-servers and
# spring.datasource.* via DynamicPropertySource.
# These are fallbacks / non-infra settings only.
# ============================================================

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Eureka
spring.cloud.discovery.enabled=false

# Disable tracing — no Jaeger in tests
management.tracing.enabled=false

# Kafka consumer settings
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.foodie.common.events

# Kafka producer settings
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true

# Kafka consumer deserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Logging — reduce noise in test output
logging.level.root=WARN
logging.level.com.foodie=INFO
logging.level.org.springframework.kafka=WARN
logging.level.org.testcontainers=INFO

# Explicitly disable OTLP tracing autoconfiguration in tests
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.tracing.enabled=false
management.tracing.sampling.probability=0.0

# Exclude OTLP autoconfiguration to prevent connection attempts in tests
spring.autoconfigure.exclude=\
  io.opentelemetry.instrumentation.spring.autoconfigure.OpenTelemetryAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration
